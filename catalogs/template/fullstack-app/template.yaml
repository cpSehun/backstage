apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fullstack-aws-app
  title: 🚀 Full Stack AWS Application
  description: Next.js frontend + Python backend + PostgreSQL database deployed on AWS with Terraform
  tags:
    - nextjs
    - python
    - postgresql
    - aws
    - terraform
    - docker
    - bitbucket
  links:
    - title: Documentation
      url: https://docs.cplabs.com/fullstack-template
      icon: docs

spec:
  owner: ai-solution-dev-2
  type: service

  parameters:
    - title: ⚠️  배포 전 필수 설정 안내
      description: |
        🔧 템플릿 실행 후 반드시 다음 단계를 수행해주세요:

        1️⃣ 생성된 저장소 → Settings → Pipelines → Repository variables

        2️⃣ 다음 4개 변수 설정:
           • AWS_ACCESS_KEY_ID (✅ Secured 체크)
           • AWS_SECRET_ACCESS_KEY (✅ Secured 체크)  
           • AWS_KEY_NAME = 아래에서 입력한 키페어 이름

        3️⃣ Pipelines 메뉴에서 "Enable Pipelines" 클릭

        4️⃣ 15분 대기 후 완성된 애플리케이션 확인!
      properties:
        acknowledgment:
          title: ✅ 위 내용을 확인하고 동의합니다
          type: boolean
          default: false
          description: 체크하지 않으면 템플릿을 실행할 수 없습니다
      required:
        - acknowledgment

    - title: 📝 애플리케이션 정보
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: 프로젝트 이름
          type: string
          description: 저장소 이름으로 사용됩니다. (소문자, 하이픈만 사용)
          pattern: '^[a-z0-9-]+$'
          ui:
            autofocus: true
            help: '예: my-awesome-app, user-management-system'
        description:
          title: 설명
          type: string
          description: 이 애플리케이션에 대한 간단한 설명
          ui:
            widget: textarea
            options:
              rows: 3
        owner:
          title: 소유자
          type: string
          description: 이 애플리케이션을 소유할 팀
          enum:
            - ai-solution-dev-1
            - ai-solution-dev-2
            - service-dev-1
            - service-dev-2
            - daepa-dev
            - lab

    - title: 📂 저장소 설정
      required:
        - project
      properties:
        project:
          title: 프로젝트 선택
          type: string
          description: Bitbucket 프로젝트를 선택하세요
          enum:
            - DEVOPS
            - REC
            - ECO

    - title: ☁️ AWS 배포 설정
      required:
        - awsRegion
        - instanceType
        - databaseInstanceType
        - keyName
      properties:
        awsRegion:
          title: AWS 리전
          type: string
          description: 애플리케이션을 배포할 AWS 리전
          default: 'ap-northeast-2'
          enum:
            - 'ap-northeast-2'
            - 'ap-northeast-1'
            - 'ap-southeast-1'
            - 'us-east-1'
            - 'us-west-2'
          enumNames:
            - '서울 (ap-northeast-2)'
            - '도쿄 (ap-northeast-1)'
            - '싱가포르 (ap-southeast-1)'
            - '버지니아 북부 (us-east-1)'
            - '오레곤 (us-west-2)'

        keyName:
          title: EC2 키페어 이름
          type: string
          description: 사전에 생성된 EC2 키페어 이름을 입력하세요
          default: 'backstage-fullstack-key'
          ui:
            help: '해당 리전에 존재하는 키페어 이름을 정확히 입력하세요'

        instanceType:
          title: EC2 인스턴스 타입
          type: string
          description: 사용할 EC2 인스턴스 타입
          default: 't3.medium'
          enum:
            - 't3.micro'
            - 't3.small'
            - 't3.medium'
            - 't3.large'
          enumNames:
            - 't3.micro (1 vCPU, 1GB RAM) - 테스트용'
            - 't3.small (2 vCPU, 2GB RAM) - 개발용'
            - 't3.medium (2 vCPU, 4GB RAM) - 운영용 (권장)'
            - 't3.large (2 vCPU, 8GB RAM) - 고성능'

        databaseInstanceType:
          title: RDS 인스턴스 타입
          type: string
          description: 사용할 RDS 인스턴스 타입
          default: 'db.t3.small'
          enum:
            - 'db.t3.micro'
            - 'db.t3.small'
            - 'db.t3.medium'
            - 'db.t3.large'
          enumNames:
            - 'db.t3.micro (1 vCPU, 1GB RAM) - 테스트용'
            - 'db.t3.small (2 vCPU, 2GB RAM) - 개발용 (권장)'
            - 'db.t3.medium (2 vCPU, 4GB RAM) - 운영용'
            - 'db.t3.large (2 vCPU, 8GB RAM) - 고성능'

  steps:
    - id: fetch
      name: 📥 템플릿 파일 가져오기
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          awsRegion: ${{ parameters.awsRegion }}
          instanceType: ${{ parameters.instanceType }}
          databaseInstanceType: ${{ parameters.databaseInstanceType }}
          keyName: ${{ parameters.keyName }}

    - id: publish
      name: 📤 Bitbucket에 저장소 생성
      action: publish:bitbucketCloud
      input:
        repoUrl: bitbucket.org?workspace=coinplugin&project=${{ parameters.project }}&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: 'main'
        gitCommitMessage: |
          🎉 Initial commit: ${{ parameters.name }} fullstack application

          Created via Backstage template with:
          - ⚛️ Next.js frontend
          - 🐍 Python FastAPI backend  
          - 🐘 PostgreSQL database
          - ☁️ AWS infrastructure with Terraform
          - 🚀 Bitbucket Pipeline CI/CD

          Ready for Repository variables setup and deployment!

    - id: register
      name: 📋 Backstage 카탈로그에 등록
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: 🔗 저장소 보기
        url: ${{ steps.publish.output.remoteUrl }}
        icon: bitbucket
      - title: 📋 Backstage에서 열기
        url: ${{ steps.register.output.catalogEntityRef }}
        icon: catalog
      - title: 🚀 Pipeline 상태 확인
        url: ${{ steps.publish.output.remoteUrl }}/pipelines
        icon: build
      - title: ☁️ AWS 콘솔
        url: https://console.aws.amazon.com/ec2/home?region=${{ parameters.awsRegion }}
    text:
      - title: 📋 다음 단계를 수행하세요 (5분)
        content: |
          🎉 저장소가 성공적으로 생성되었습니다!

          ## 🔧 배포를 위한 필수 설정:

          ### 1️⃣ 환경 변수 설정 (3분)
          ```
          📍 경로: 저장소 → Settings → Pipelines → Repository variables

          추가할 변수 4개:
          ├── AWS_ACCESS_KEY_ID = your-aws-access-key (✅ Secured)
          ├── AWS_SECRET_ACCESS_KEY = your-aws-secret-key (✅ Secured)
          └── AWS_KEY_NAME = ${{ parameters.keyName }} (⬜ Secured 안함)
          ```

          ### 2️⃣ Pipeline 활성화 및 실행 (2분)
          ```
          📍 경로: 저장소 → Pipelines 메뉴

          ✅ "Enable Pipelines" 버튼 클릭
          ✅ 자동으로 첫 번째 배포 시작! (15분 소요)
          ```

          ### 3️⃣ 결과 확인 (배포 완료 후)
          ```
          ✅ Pipeline 로그에서 Application URL 확인
          ✅ AWS Console에서 생성된 리소스 확인:
             ├── EC2 Auto Scaling Group
             ├── RDS PostgreSQL Database  
             ├── Application Load Balancer
             └── VPC 네트워크
          ✅ 웹 브라우저에서 애플리케이션 접속 테스트
          ```

          ## 🎯 준비사항 체크:
          - ✅ AWS 액세스 키 발급 완료
          - ✅ EC2 키페어(${{ parameters.keyName }}) 생성 완료 (${{ parameters.awsRegion }} 리전)
          - ✅ AWS 권한 확인 (EC2, RDS, VPC, IAM)

          ## 🆘 문제 발생 시:
          - Pipeline 로그에서 정확한 오류 메시지 확인
          - AWS 권한 또는 키페어 이름 재확인  
          - 환경 변수의 Secured 체크박스 설정 확인

          **🚀 설정 완료 후 15분이면 완전한 풀스택 애플리케이션이 AWS에서 실행됩니다!**
