apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: example-nodejs-template
  title: Example Node.js Template
  description: An example template for the scaffolder that creates a simple Node.js service
spec:
  owner: ai-solution-dev-2
  type: service

  parameters:
    - title: Fill in repository details
      required:
        - component_id
        - workspace
        - projectKey
      properties:
        component_id:
          title: Repository Name
          type: string
          description: Unique name of the new repository
          ui:autofocus: true
        workspace:
          title: Bitbucket Workspace
          type: string
          description: The ID of the Bitbucket Workspace where the repository will be created.
          # 기본 워크스페이스 값을 지정합니다.
          default: 'coinplugin'
        projectKey:
          title: Bitbucket Project Key
          type: string
          description: The key of the Bitbucket project (e.g., 'PROJ').
          # enum을 사용하여 드롭다운 메뉴를 생성합니다.
          enum:
            - 'DEVOPS'
            - 'REC'
            - 'ECO'
        description:
          title: Description
          type: string
          description: A description for the new repository.

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.component_id }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:bitbucketCloud
      input:
        # Construct the repoUrl using a special format that the backend understands.
        # This explicitly provides the workspace, project and repository name.
        repoUrl: bitbucket.org?workspace=${{ parameters.workspace }}&project=${{ parameters.projectKey }}&repo=${{ parameters.component_id }}
        description: ${{ parameters.description }}
        defaultBranch: 'main'

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
